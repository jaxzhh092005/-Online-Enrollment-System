{% extends "students/base.html" %}
{% block title %}Remove {{ student.full_name }}{% endblock %}
{% block content %}
<div class="confirm">
  <h1>Remove {{ student.full_name }}?</h1>
  <p>This permanently deletes the profile for {{ student.student_id }}. This can’t be undone.</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button class="btn danger solid" type="submit">Remove student</button>
    <a class="btn" href="{% url 'student_list' %}?student={{ student.pk }}">Keep student</a>
  </form>
</div>
{% endblock %}
